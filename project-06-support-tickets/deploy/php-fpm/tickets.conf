; /etc/php/8.3/fpm/pool.d/tickets.conf — a dedicated PHP-FPM pool for this app
[tickets]
; Workers run as the unprivileged app user, not www-data
user  = tickets
group = tickets

; Unix domain socket instead of TCP 127.0.0.1:9000:
;  - no TCP/IP stack overhead, no port to firewall
;  - access controlled by FILE PERMISSIONS on the socket
listen = /run/php/php8.3-fpm-tickets.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Process manager tuned for 1 GB RAM: spawn on demand, die when idle
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 300

; Expose FPM status for debugging (only reachable through nginx's localhost-only location)
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Security: don't leak the environment; our app reads /etc/tickets/tickets.env itself
clear_env = yes
security.limit_extensions = .php

; Per-pool PHP settings (php_admin_* cannot be overridden by the app)
php_admin_value[memory_limit] = 64M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 2M
php_admin_value[session.save_path] = /var/lib/php/sessions-tickets
php_admin_value[session.use_strict_mode] = 1
php_admin_value[error_log] = /var/log/tickets/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[open_basedir] = /opt/tickets/:/etc/tickets/:/var/lib/php/sessions-tickets/:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen

; Slow request log — great for debugging hung DB calls
request_slowlog_timeout = 5s
slowlog = /var/log/tickets/php-slow.log
request_terminate_timeout = 30s
catch_workers_output = yes
