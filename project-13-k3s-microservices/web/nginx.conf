# nginx inside the web pod: SPA only. /api is routed by the Traefik Ingress straight to the api Service.
server {
    listen 8080;                      # non-root container → unprivileged port
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }
}
