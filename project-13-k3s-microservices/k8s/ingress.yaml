# k3s ships Traefik as the default Ingress controller, exposed on the node's ports 80/443
# (via the built-in ServiceLB). No host rule → matches http://127.0.0.1, http://<LAN-IP>, and
# http://<anything>.sslip.io pointing at this machine.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microsvc
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
