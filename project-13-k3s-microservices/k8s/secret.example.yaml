# NOT applied by kustomize. scripts/cluster_bootstrap.sh / Ansible create the real Secret with:
#   kubectl -n microsvc create secret generic db-credentials \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=DATABASE_URL=postgresql://app:...@postgres:5432/microsvc?sslmode=disable
# Secrets are only base64-encoded (NOT encrypted) — never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: microsvc
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql://app:change-me@postgres:5432/microsvc?sslmode=disable
