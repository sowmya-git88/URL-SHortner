apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never drop below desired capacity
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, tier: backend }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532      # numeric UID so the kubelet can verify "non-root" (distroless 'nonroot')
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: microsvc/api:1.0.0
          imagePullPolicy: Never          # image is imported into k3s' containerd, no registry
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: db-credentials, key: DATABASE_URL } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }   # Downward API
          readinessProbe:                  # "may I receive traffic?" → checks Postgres
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:                   # "am I hung? restart me" → NO dependency checks
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Horizontal Pod Autoscaler (k3s ships metrics-server): scale on CPU vs. the *request* (50m)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }
