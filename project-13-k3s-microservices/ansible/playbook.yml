# Provision a single-node k3s cluster on the laptop and deploy the microservices.
#   cd project-13-k3s-microservices/ansible
#   ansible-playbook playbook.yml --ask-become-pass            # full run
#   ansible-playbook playbook.yml --tags deploy                # only rebuild + redeploy
#   ansible-playbook playbook.yml --check --diff --tags base   # dry run of the OS part
- name: k3s microservices lab
  hosts: k3s_nodes
  gather_facts: true

  pre_tasks:
    - name: Only Linux with systemd is supported
      ansible.builtin.assert:
        that:
          - ansible_system == "Linux"
          - ansible_service_mgr == "systemd"
        fail_msg: "This lab needs a systemd-based Linux host"
      tags: [always]

  tasks:
    # ------------------------------------------------------------------ base OS
    - name: Install base packages
      ansible.builtin.apt:
        name: [curl, ca-certificates, jq, git, conntrack, iptables]
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
      tags: [base]

    - name: Is Docker already installed (e.g. Docker CE from Project 11)?
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false
      tags: [base]

    - name: Install docker.io when Docker is missing (used only to BUILD images)
      ansible.builtin.apt:
        name: docker.io
        state: present
      when: docker_check.rc != 0 and ansible_os_family == "Debian"
      tags: [base]

    - name: Kernel settings needed by Kubernetes networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-k3s-lab.conf
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          fs.inotify.max_user_instances = 512
        mode: "0644"
      register: sysctl_file
      tags: [base]

    - name: Load br_netfilter module now and at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s-lab.conf
        content: "br_netfilter\noverlay\n"
        mode: "0644"
      tags: [base]

    - name: Apply sysctl settings
      ansible.builtin.shell: modprobe br_netfilter || true; sysctl --system >/dev/null
      when: sysctl_file.changed
      changed_when: true
      tags: [base]

    # ------------------------------------------------------------------ k3s
    - name: Port 80 must be free for Traefik (stop Project 11/12 stacks first)
      ansible.builtin.shell: |
        set -o pipefail
        ss -Htlnp 'sport = :80' | grep -v -E 'traefik|k3s|svclb' || true
      args: { executable: /bin/bash }
      register: port80
      changed_when: false
      tags: [k3s]

    - name: Warn about a port-80 conflict
      ansible.builtin.debug:
        msg: "Something else listens on :80 → {{ port80.stdout }} — run 'docker compose down' in project 11/12"
      when: port80.stdout | length > 0
      tags: [k3s]

    - name: Download the k3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/bin/k3s-install.sh
        mode: "0755"
      tags: [k3s]

    - name: Install k3s (idempotent thanks to 'creates')
      ansible.builtin.command: /usr/local/bin/k3s-install.sh
      environment:
        INSTALL_K3S_EXEC: "{{ k3s_install_exec }}"
      args:
        creates: /usr/local/bin/k3s
      tags: [k3s]

    - name: Ensure k3s is running and enabled
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
      tags: [k3s]

    - name: Wait for the node to be Ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false
      retries: 3
      delay: 10
      register: node_ready
      until: node_ready.rc == 0
      tags: [k3s]

    - name: Create ~/.kube for {{ kube_user }}
      ansible.builtin.file:
        path: "~{{ kube_user }}/.kube"
        state: directory
        owner: "{{ kube_user }}"
        mode: "0700"
      tags: [k3s]

    - name: Copy kubeconfig for {{ kube_user }}
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "~{{ kube_user }}/.kube/config"
        remote_src: true
        owner: "{{ kube_user }}"
        mode: "0600"
      tags: [k3s]

    # ------------------------------------------------------------------ images
    - name: Build container images
      ansible.builtin.command: >
        docker build -t microsvc/{{ item }}:{{ image_tag }} {{ project_dir }}/{{ item }}
      loop: "{{ services }}"
      changed_when: true
      tags: [deploy, images]

    - name: Import images into k3s containerd (no registry needed)
      ansible.builtin.shell: |
        set -o pipefail
        docker save microsvc/{{ item }}:{{ image_tag }} | k3s ctr images import -
      args: { executable: /bin/bash }
      loop: "{{ services }}"
      changed_when: true
      tags: [deploy, images]

    # ------------------------------------------------------------------ deploy
    - name: Namespace (apply is idempotent)
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl apply -f {{ project_dir }}/k8s/namespace.yaml
      args: { executable: /bin/bash }
      register: ns
      changed_when: "'created' in ns.stdout or 'configured' in ns.stdout"
      tags: [deploy]

    - name: Database credentials Secret (generated, never stored in Git)
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl -n {{ namespace }} create secret generic db-credentials \
          --from-literal=POSTGRES_PASSWORD='{{ db_password }}' \
          --from-literal=DATABASE_URL='postgresql://app:{{ db_password }}@postgres:5432/microsvc?sslmode=disable' \
          --dry-run=client -o yaml | k3s kubectl apply -f -
      args: { executable: /bin/bash }
      no_log: true
      register: secret
      changed_when: "'created' in secret.stdout or 'configured' in secret.stdout"
      tags: [deploy]

    - name: Apply all manifests with kustomize
      ansible.builtin.command: k3s kubectl apply -k {{ project_dir }}/k8s
      register: apply
      changed_when: "'created' in apply.stdout or 'configured' in apply.stdout"
      tags: [deploy]

    - name: Restart deployments so pods pick up freshly imported images with the same tag
      ansible.builtin.command: k3s kubectl -n {{ namespace }} rollout restart deployment/{{ item }}
      loop: "{{ services }}"
      changed_when: true
      tags: [deploy]

    - name: Wait for Postgres
      ansible.builtin.command: k3s kubectl -n {{ namespace }} rollout status statefulset/postgres --timeout=180s
      changed_when: false
      tags: [deploy]

    - name: Wait for deployments
      ansible.builtin.command: k3s kubectl -n {{ namespace }} rollout status deployment/{{ item }} --timeout=180s
      loop: "{{ services }}"
      changed_when: false
      tags: [deploy]

    - name: Smoke test through the Ingress
      ansible.builtin.uri:
        url: http://127.0.0.1/api/health
        return_content: true
      register: smoke
      retries: 12
      delay: 5
      until: smoke.status == 200
      tags: [deploy, smoke]

    - name: Show result
      ansible.builtin.debug:
        msg: "API healthy via Ingress: {{ smoke.json }} → open http://127.0.0.1/"
      tags: [deploy, smoke]
