server:
  port: 8080
  shutdown: graceful            # finish in-flight requests on SIGTERM

spring:
  application:
    name: store
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://localhost:5432/store
    username: store
    password: store
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: fulfillment
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness and /readiness
      show-details: always
  metrics:
    tags:
      application: store
    distribution:
      percentiles-histogram:
        http.server.requests: true
        orders.fulfillment.latency: true

store:
  topic: orders
  # artificial processing delay in the consumer (ms) — raise it to watch lag/latency grow in Grafana
  fulfillment-delay-ms: 200

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
