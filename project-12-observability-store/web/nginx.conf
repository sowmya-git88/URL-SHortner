# Nginx inside the web container: serves the React build and reverse-proxies /api to Spring Boot
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Docker's embedded DNS; re-resolve store-app if the container is recreated
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://store-app:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Actuator is internal: Prometheus scrapes store-app directly on the monitoring network
    location /actuator/ { return 404; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
