global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    lab: project-12

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: store-app
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["store-app:8080"]
        labels:
          service: store

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: laptop
