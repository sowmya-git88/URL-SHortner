# /etc/fail2ban/filter.d/mdblog-auth.conf
# Matches lines written by the Rust API on a bad admin token:
#   2025-01-31T10:00:00Z mdblog auth failure from 203.0.113.9 path=/api/posts
[Definition]
failregex = ^\S+ mdblog auth failure from <HOST> path=\S*$
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%SZ
