<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shorty · Project 01</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>🔗 Shorty</h1>
    <p class="muted">Flask + SQLite behind Caddy · Project 01</p>

    <form id="shorten-form">
      <input id="url" type="url" placeholder="https://example.com/very/long/path" required>
      <input id="code" type="text" placeholder="custom code (optional)" pattern="[A-Za-z0-9_-]{3,32}">
      <button type="submit">Shorten</button>
    </form>
    <p id="result" class="result" hidden></p>
    <p id="error" class="error" hidden></p>

    <h2>Recent links</h2>
    <table>
      <thead><tr><th>Short</th><th>Target</th><th>Clicks</th><th></th></tr></thead>
      <tbody id="links"></tbody>
    </table>
    <footer id="health" class="muted">checking API…</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
